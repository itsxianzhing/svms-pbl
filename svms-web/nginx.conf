
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers -------------------------------------------------------
    add_header Content-Security-Policy "frame-ancestors 'self' https://svms.itsxianzhing.tech https://aistudio.google.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API reverse proxy ------------------------------------------------------
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://svms-api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        client_max_body_size 1m;

        add_header Content-Security-Policy "frame-ancestors 'self' https://svms.itsxianzhing.tech https://aistudio.google.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- index.html -------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://svms.itsxianzhing.tech https://aistudio.google.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Static assets ----------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self' https://svms.itsxianzhing.tech https://aistudio.google.com;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Gzip compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server_tokens off;
}

